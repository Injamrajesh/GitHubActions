name: My First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print a message
        run: echo "Hello from GitHub Actions!"

      - name: Print current date
        run: date

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la
