name: conditional-workflow

on:
    workflow_dispatch:
        inputs:
            simulate_failure:
                description: "Simulate failure in the workflow"
                type: boolean
                required: false
                default: false
            target_branch:
                description: "Target branch for the workflow"
                type: string
                required: true
                default: main

    push:
        branches:
            - main
            - develop
jobs:
    conditional-demo:
        name: Conditional-steps
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Always run
              run:  echo " This step always runs"
            
            - name: Conditional Step run only on main branch
              if: github.ref == 'ref/heads/main'
              run: echo " This step runs  only on the   main branch"
              



