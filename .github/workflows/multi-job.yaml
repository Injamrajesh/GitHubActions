name: multi-job

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    job1:
        name: Job 1
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run Job 1
              run: echo "This is Job 1"

    job2:
        name: Job 2
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run Job 2
              run: echo "This is Job 2, which runs after Job 1"
    job3:
        name: Job 3
        runs-on: ubuntu-latest
        needs: job2
        if: success()
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run Job 3
              run: echo "This is Job 3, which runs after Job 2"          